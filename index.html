<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<title>Calibração em campo</title>
<style>
:root{--fundo:#f4f4f2;--cartao:#fff;--texto:#1f2328;--suave:#5f6368;--linha:#d9d9d6;--destaque:#c9302c;--ok:#1e7a3c;--aviso:#b7791f;--erro:#c9302c;--campo:#fffdf0;--barra:#1f2328}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--barra);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:16px;padding:6px 4px}
#menu-bt{font-size:24px;line-height:1;padding:4px 6px}
#veu{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
#menu{position:fixed;top:0;right:0;bottom:0;width:min(82vw,320px);background:var(--cartao);z-index:31;transform:translateX(100%);transition:transform .2s ease;padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column}
#menu.aberto{transform:none;box-shadow:-8px 0 24px rgba(0,0,0,.15)}
[hidden]{display:none!important}
#menu .quem{padding:4px 20px 14px;border-bottom:1px solid var(--linha);margin-bottom:6px}#menu .quem b{display:block;font-size:17px}#menu .quem small{color:var(--suave)}
#menu button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;font:500 16px inherit;color:var(--texto);padding:14px 20px}
#menu button.atual{background:var(--fundo);font-weight:700;box-shadow:inset 3px 0 0 var(--destaque)}
#menu button i{font-style:normal;width:22px;text-align:center}#menu button span{flex:1}
#menu .cont{font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--fundo);color:var(--suave)}#menu .cont.alerta{background:#f6dcdb;color:var(--erro)}
#menu .rod{margin-top:auto;padding:14px 20px 0;font-size:12px;color:var(--suave);border-top:1px solid var(--linha)}
@media (prefers-reduced-motion: reduce){#menu{transition:none}}
main{padding:14px 16px calc(env(safe-area-inset-bottom) + 100px);max-width:720px;margin:0 auto}
html{scroll-padding-bottom:calc(env(safe-area-inset-bottom) + 110px);scroll-padding-top:70px}
main input,main button,main textarea,main select{scroll-margin-bottom:calc(env(safe-area-inset-bottom) + 110px)}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:14px;margin:0 0 12px}
.cartao h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linha)}
.item:first-of-type{border-top:0}
.item .txt{flex:1;min-width:0}.item .txt b{display:block}.item .txt small{color:var(--suave)}
.selo{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.s-pendente{background:#eceae4;color:var(--suave)}.s-andamento{background:#fdf1dc;color:var(--aviso)}.s-pronto{background:#e0f1e6;color:var(--ok)}.s-nao{background:#f6dcdb;color:var(--erro)}
label.cp{display:block;margin:0 0 10px}label.cp span{display:block;font-size:13px;color:var(--suave);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--linha);border-radius:9px;background:#fff;color:var(--texto)}
input.med{background:var(--campo);font-size:18px;font-variant-numeric:tabular-nums;text-align:right;padding:10px 8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--texto);outline-offset:-1px}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grade3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button.bt{display:block;width:100%;font:600 16px/1 inherit;padding:15px;border-radius:10px;border:1px solid var(--texto);background:var(--texto);color:#fff;margin:8px 0}
button.bt.sec{background:#fff;color:var(--texto)}button.bt.perigo{background:#fff;color:var(--erro);border-color:var(--erro)}
button.mini{font:600 14px inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--linha);background:#fff;color:var(--texto)}
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--cartao);border-top:1px solid var(--linha);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px;z-index:5}
.rodape button{flex:1;margin:0}
.passos{display:flex;gap:4px;margin:0 0 14px}.passos i{flex:1;height:4px;border-radius:2px;background:var(--linha)}.passos i.on{background:var(--texto)}
.ponto{border:1px solid var(--linha);border-radius:10px;padding:10px;margin:0 0 10px;background:#fff}
.ponto .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ponto .top b{flex:1}
.leit{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.leit input{padding:10px 4px;font-size:16px}
.rot{font-size:12px;color:var(--suave);margin:6px 0 3px}
.msg{font-size:13px;margin-top:6px}.msg.aviso{color:var(--aviso)}.msg.erro{color:var(--erro)}.msg.ok{color:var(--ok)}
input.destoa{border:2px solid var(--erro);background:#fdeceb}input.alerta{border:2px solid var(--aviso)}
.plat{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:8px;border:2px solid var(--texto);border-radius:10px;padding:10px;background:#fafaf8}
.plat div{text-align:center}.plat small{display:block;color:var(--suave);font-size:12px}
.pad{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--linha)}.pad:first-child{border-top:0}
.pad input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}
.venc{color:var(--erro);font-weight:600}.vence{color:var(--aviso);font-weight:600}.val{color:var(--ok)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--texto);border-radius:10px;overflow:hidden}.seg button{font:700 17px inherit;padding:12px;border:0;background:#fff;color:var(--texto)}.seg button.on{background:var(--texto);color:#fff}
.padsel{border:1px solid var(--linha);border-radius:10px;padding:10px;margin:0 0 10px;background:#fafaf8}.padsel .top{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}.padsel .top span{flex:1;font-size:14px}
.tabpesos{margin-top:8px}.tabpesos summary{font-size:14px;font-weight:600;cursor:pointer;padding:4px 0}.resumo th{font-size:12px;color:var(--suave);text-align:right;padding:4px 6px}.resumo td{text-align:right}
.msg.info{color:var(--texto);background:#eef3f8;border-radius:6px;padding:5px 8px;font-variant-numeric:tabular-nums}
.vazio{color:var(--suave);text-align:center;padding:30px 10px}
.faixa{font-size:13px;color:var(--suave);margin:-4px 0 12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
video{width:100%;border-radius:10px;background:#000}
.resumo td{padding:4px 6px;border-bottom:1px solid var(--linha);font-variant-numeric:tabular-nums}.resumo{width:100%;border-collapse:collapse;font-size:14px}
</style>
</head>
<body>
<header><button id="voltar" hidden aria-label="Voltar">‹ Voltar</button><h1 id="titulo">Calibração em campo</h1><button id="menu-bt" aria-label="Menu" aria-expanded="false">☰</button></header>
<div id="veu" hidden></div>
<nav id="menu" aria-label="Menu principal"></nav>
<main id="tela"></main>
<div class="rodape" id="rodape" hidden></div>
<div class="toast" id="toast"></div>

<script src="jsQR.js" defer></script>
<script>
const PADROES_PADRAO = [];
const CHAVE = 'campo-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- armazenamento ----------
let db = { perfil: { nome: '', apelido: '', padroes: PADROES_PADRAO, kit: [] }, visitas: [] };
try { const s = localStorage.getItem(CHAVE); if (s) db = Object.assign(db, JSON.parse(s)); } catch (e) {}
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(db)); } catch (e) { toast('Não consegui salvar no celular'); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }
function num(s) { if (s === '' || s == null) return null; const v = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isNaN(v) ? null : v; }
function fmt(v, c) { if (v == null) return ''; return c == null ? String(v).replace('.', ',') : v.toFixed(c).replace('.', ','); }
function hojeISO() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
function agoraISO() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); }
function dataBR(iso) { if (!iso) return ''; const [a, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${a}`; }
function parseBR(s) { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s || ''); return m ? new Date(+m[3], m[2] - 1, +m[1]) : null; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function casasDe(div) { const s = String(div ?? '').match(/[\d.,]+/); if (!s) return null; const t = s[0].replace(',', '.'); return t.includes('.') ? t.split('.')[1].length : 0; }
function divisaoNum(div) { const s = String(div ?? '').match(/[\d.,]+/); return s ? num(s[0]) : null; }

// situação do padrão na data da calibração
function situacaoPadrao(p, dataISO) {
  const v = parseBR(p.validade); if (!v) return { cls: 'vence', txt: 'sem validade cadastrada' };
  const d = dataISO ? new Date(dataISO.slice(0, 10) + 'T12:00') : new Date();
  const dias = Math.floor((v - d) / 864e5);
  if (dias < 0) return { cls: 'venc', txt: `VENCIDO em ${p.validade}`, nivel: 2 };
  if (dias <= 30) return { cls: 'vence', txt: `vence em ${dias} dia(s), ${p.validade}`, nivel: 1 };
  return { cls: 'val', txt: `válido até ${p.validade}`, nivel: 0 };
}

// ---------- navegação ----------
let rota = { tela: 'inicio' };
function ir(r) { rota = r; history.pushState(r, ''); desenha(); window.scrollTo(0, 0); }
window.onpopstate = e => { rota = e.state || { tela: 'inicio' }; desenha(); };
$('#voltar').onclick = () => history.back();
// ---------- menu ----------
function alertasPadroes() { return db.perfil.padroes.filter(x => (situacaoPadrao(x).nivel || 0) > 0).length; }
function abreMenu(abrir) {
  const m = $('#menu');
  if (abrir) {
    const pend = db.visitas.flatMap(v => v.instrumentos).filter(i => i.situacao === 'pendente' || i.situacao === 'andamento').length;
    const al = alertasPadroes(), atual = rota.tela;
    const item = (tela, ic, txt, cont, cls) => `<button data-ir="${tela}" class="${atual === tela ? 'atual' : ''}"><i>${ic}</i><span>${txt}</span>${cont != null ? `<em class="cont ${cls || ''}">${cont}</em>` : ''}</button>`;
    m.innerHTML = `<div class="quem"><b>${esc(db.perfil.nome || 'Técnico sem nome')}</b><small>${db.visitas.length} visita(s) no celular</small></div>
      ${item('inicio', '⌂', 'Visitas', db.visitas.length)}
      ${item('instrumentos', '⚖', 'Instrumentos', pend ? pend + ' a fazer' : null)}
      ${item('padroes', '◎', 'Padrões', al ? al + ' alerta(s)' : db.perfil.padroes.length, al ? 'alerta' : '')}
      ${item('ler', '▣', 'Receber ordem do PCP')}
      ${item('novaVisita', '+', 'Nova visita')}
      ${item('perfil', '☺', 'Meu perfil')}
      <div class="rod">Os dados ficam só neste celular até você enviar a visita ao laboratório.</div>`;
    m.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { abreMenu(false); if (b.dataset.ir !== rota.tela) ir({ tela: b.dataset.ir }); });
  }
  m.classList.toggle('aberto', abrir); $('#veu').hidden = !abrir; $('#menu-bt').setAttribute('aria-expanded', abrir);
}
$('#menu-bt').onclick = () => abreMenu(!$('#menu').classList.contains('aberto'));
$('#veu').onclick = () => abreMenu(false);

function visita(id) { return db.visitas.find(v => v.id === id); }
function rodape(botoes) {
  const r = $('#rodape');
  if (!botoes) { r.hidden = true; r.innerHTML = ''; return; }
  r.hidden = false; r.innerHTML = '';
  for (const [txt, fn, cls] of botoes) { const b = document.createElement('button'); b.className = 'bt ' + (cls || ''); b.textContent = txt; b.onclick = fn; r.appendChild(b); }
}

function desenha() {
  $('#voltar').hidden = rota.tela === 'inicio';
  const t = $('#tela'); t.oninput = t.onchange = t.onclick = null;
  abreMenu(false);
  ({ inicio: telaInicio, instrumentos: telaInstrumentos, padroes: telaPadroes, perfil: telaPerfil, visita: telaVisita, instrumento: telaInstrumento, ler: telaLer, novaVisita: telaNovaVisita })[rota.tela]();
}

// ---------- início ----------
function statusVisita(v) {
  const n = v.instrumentos.length, prontos = v.instrumentos.filter(i => ['pronto', 'nao_calibrado'].includes(i.situacao)).length;
  if (v.enviada) return ['s-pronto', 'enviada'];
  if (n && prontos === n) return ['s-pronto', 'pronta para enviar'];
  if (v.instrumentos.some(i => i.situacao === 'andamento' || i.situacao === 'pronto')) return ['s-andamento', `${prontos}/${n}`];
  return ['s-pendente', `${n} instrumento(s)`];
}
function telaInicio() {
  $('#titulo').textContent = 'Calibração em campo';
  const semPerfil = !db.perfil.nome;
  const lista = db.visitas.slice().sort((a, b) => (b.criada || '').localeCompare(a.criada || ''));
  $('#tela').innerHTML = `
    ${semPerfil ? `<div class="cartao"><h2>Primeiro uso</h2><p>Cadastre seu nome e os padrões do seu kit. Isso é feito uma vez só e vale para todas as visitas.</p><button class="bt" id="ir-perfil">Cadastrar meu perfil</button></div>` : ''}
    <div class="cartao"><h2>Visitas</h2>
      ${lista.length ? lista.map(v => { const [c, t] = statusVisita(v); return `<div class="item" data-id="${v.id}"><div class="txt"><b>${esc(v.cliente.nome || 'Cliente sem nome')}</b><small>${dataBR(v.criada)} · ${v.origem === 'pcp' ? 'ordem do PCP' : 'aberta no campo'}${v.os ? ' · OS ' + esc(v.os) : ''}</small></div><span class="selo ${c}">${t}</span></div>`; }).join('')
      : '<div class="vazio">Nenhuma visita ainda.<br>Leia o QR do PCP ou abra uma visita aqui mesmo.</div>'}
    </div>`;
  $('#ir-perfil') && ($('#ir-perfil').onclick = () => ir({ tela: 'perfil' }));
  document.querySelectorAll('.item[data-id]').forEach(el => el.onclick = () => ir({ tela: 'visita', id: el.dataset.id }));
  rodape([['Ler QR do PCP', () => ir({ tela: 'ler' })], ['Nova visita', () => ir({ tela: 'novaVisita' }), 'sec']]);
}

// ---------- perfil ----------
function telaPerfil() {
  $('#titulo').textContent = 'Meu perfil';
  const p = db.perfil;
  $('#tela').innerHTML = `
    <div class="cartao"><h2>Técnico</h2>
      <label class="cp"><span>Nome completo (vai em "Técnico Executante")</span><input id="p-nome" value="${esc(p.nome)}" autocomplete="name"></label>
      <label class="cp"><span>Como assina como digitador</span><input id="p-apelido" value="${esc(p.apelido)}" placeholder="ex.: Eduardo"></label>
    </div>
    <div class="cartao"><h2>Meu kit de padrões</h2><p class="faixa" style="margin:0 0 10px">${p.kit.length ? p.kit.map(esc).join(', ') : 'Nenhum marcado ainda.'}</p><button class="mini" id="ir-padroes">Escolher padrões</button></div>`;
  const guarda = () => { p.nome = $('#p-nome').value.trim(); p.apelido = $('#p-apelido').value.trim(); salvar(); };
  $('#tela').oninput = $('#tela').onchange = guarda;
  $('#ir-padroes').onclick = () => ir({ tela: 'padroes' });
  rodape([['Pronto', () => history.back()]]);
}

// ---------- instrumentos de todas as visitas ----------
function telaInstrumentos() {
  $('#titulo').textContent = 'Instrumentos';
  const todos = db.visitas.flatMap(v => v.instrumentos.map((i, k) => ({ v, i, k })));
  const grupos = [['andamento', 'Em andamento'], ['pendente', 'A fazer'], ['pronto', 'Prontos'], ['nao_calibrado', 'Não calibrados']];
  $('#tela').innerHTML = todos.length ? grupos.map(([sit, tit]) => {
    const g = todos.filter(x => x.i.situacao === sit); if (!g.length) return '';
    return `<div class="cartao"><h2>${tit} (${g.length})</h2>${g.map(({ v, i, k }) => { const cd = i.cadastro; const [c, t] = SIT[i.situacao]; return `<div class="item" data-v="${v.id}" data-k="${k}"><div class="txt"><b>${esc(cd.n_metrologico || 'Sem tag')}</b><small>${esc(v.cliente.nome || '')} · ${esc([cd.instrumento, cd.fabricante, cd.modelo].filter(Boolean).join(' · '))}</small></div><span class="selo ${c}">${t}</span></div>`; }).join('')}</div>`;
  }).join('') : '<div class="cartao"><div class="vazio">Nenhum instrumento. Receba uma ordem do PCP.</div></div>';
  document.querySelectorAll('.item[data-v]').forEach(el => el.onclick = () => ir({ tela: 'instrumento', id: el.dataset.v, k: +el.dataset.k, passo: 0 }));
  rodape(null);
}

// ---------- padrões ----------
function telaPadroes() {
  $('#titulo').textContent = 'Padrões';
  const p = db.perfil;
  const ordem = p.padroes.slice().sort((a, b) => (situacaoPadrao(b).nivel || 0) - (situacaoPadrao(a).nivel || 0) || a.codigo.localeCompare(b.codigo));
  const cartao = x => {
    const s = situacaoPadrao(x), noKit = p.kit.includes(x.codigo);
    const tab = x.pesos ? `<details class="tabpesos"><summary>${Object.keys(x.pesos).length} pesos no certificado (${esc(x.unidade_pesos || '')})</summary><table class="resumo"><tr><th>Nominal</th><th>VC</th><th>uest</th><th>upad</th></tr>${Object.entries(x.pesos).map(([n, t]) => `<tr><td>${fmtN(n)}</td><td>${fmtN(t.vc)}</td><td>${fmtN(t.uest)}</td><td>${fmtN(t.upad)}</td></tr>`).join('')}</table></details>` : '';
    return `<div class="padsel"><div class="top"><b>${esc(x.codigo)}</b><span>${esc(x.descricao)}</span></div>
      <small>Cert. ${esc(x.certificado)} · ${esc(x.organismo)}</small><br><small class="${s.cls}">${s.txt}</small>${tab}
      <label class="pad" style="border:0;padding:8px 0 0"><input type="checkbox" data-kit="${esc(x.codigo)}" ${noKit ? 'checked' : ''}><span>No meu kit (vem marcado em cada calibração)</span></label></div>`;
  };
  $('#tela').innerHTML = `
    ${ordem.length ? `<div class="cartao"><h2>No celular (${ordem.length})</h2>${ordem.map(cartao).join('')}</div>` : '<div class="cartao"><div class="vazio">Nenhum padrão ainda. Eles chegam com a ordem do PCP.</div></div>'}
    <div class="cartao"><h2>Cadastrar outro padrão</h2>
      <div class="grade2"><label class="cp"><span>Código</span><input id="n-cod" placeholder="CPP-011"></label><label class="cp"><span>Validade</span><input id="n-val" placeholder="31/03/2027" inputmode="numeric"></label></div>
      <label class="cp"><span>Descrição</span><input id="n-desc" placeholder="JOGO DE PESOS PADRÃO - F1"></label>
      <div class="grade2"><label class="cp"><span>Certificado</span><input id="n-cert"></label><label class="cp"><span>Organismo</span><input id="n-org"></label></div>
      <button class="mini" id="n-add">Adicionar padrão</button>
    </div>`;
  $('#tela').onchange = e => { const c = e.target.dataset.kit; if (!c) return; p.kit = e.target.checked ? [...new Set([...p.kit, c])] : p.kit.filter(x => x !== c); salvar(); toast(e.target.checked ? `${c} no kit` : `${c} fora do kit`); };
  rodape(null);
  $('#n-add').onclick = () => {
    const cod = $('#n-cod').value.trim().toUpperCase(); if (!cod) return toast('Informe o código');
    if (!/^\d{2}\/\d{2}\/\d{4}$/.test($('#n-val').value.trim())) return toast('Validade no formato dd/mm/aaaa');
    p.padroes = p.padroes.filter(x => x.codigo !== cod);
    p.padroes.push({ codigo: cod, descricao: $('#n-desc').value.trim().toUpperCase(), certificado: $('#n-cert').value.trim(), validade: $('#n-val').value.trim(), organismo: $('#n-org').value.trim().toUpperCase() });

// ---------- ordem do PCP ----------
function importarOrdem(txt) {
  let o;
  try { o = JSON.parse(txt); } catch (e) {
    try { o = JSON.parse(decodeURIComponent(escape(atob(txt.replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e2) { toast('Código não reconhecido'); return false; }
  }
  if (!o || !o.instrumentos) { toast('Isso não é uma ordem do PCP'); return false; }
  if (db.visitas.some(v => v.id === o.visita_id)) { toast('Essa ordem já está no celular'); ir({ tela: 'visita', id: o.visita_id }); return true; }
  if (Array.isArray(o.padroes)) { for (const x of o.padroes) { db.perfil.padroes = db.perfil.padroes.filter(y => y.codigo !== x.codigo); db.perfil.padroes.push(x); } db.perfil.padroes.sort((a, b) => a.codigo.localeCompare(b.codigo)); }
  const v = { id: o.visita_id || uid(), origem: 'pcp', criada: agoraISO(), os: o.os || '', cliente: o.cliente || {}, instrumentos: o.instrumentos.map(i => { const n = novoInstrumento(i.tipo || 'balanca', i.cadastro || {}); if (Array.isArray(i.padroes_usados) && i.padroes_usados.length) n.campo.padroes_usados = [...i.padroes_usados]; return n; }) };
  db.visitas.push(v); salvar(); toast('Ordem recebida'); history.replaceState({ tela: 'inicio' }, ''); ir({ tela: 'visita', id: v.id }); return true;
}
function novoInstrumento(tipo, cad) {
  return { uid: uid(), tipo, cadastro: cad, situacao: 'pendente', campo: { pontos: [], excentricidade: { antes: [], depois: [] }, padroes_usados: [...db.perfil.kit] } };
}
// link do PCP: ...#ordem=BASE64
function checaLink() { if (location.hash.startsWith('#ordem=')) { const t = location.hash.slice(7); history.replaceState({ tela: 'inicio' }, '', location.pathname); setTimeout(() => importarOrdem(t), 50); } }
checaLink();

let fluxo = null;
function telaLer() {
  $('#titulo').textContent = 'Receber ordem do PCP';

async function iniciaCamera() {
  const v = $('#cam'); if (!v) return;
  try { fluxo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch (e) { $('#cam-msg').textContent = 'Câmera indisponível. Use o arquivo ou cole o código.'; return; }
  v.srcObject = fluxo; await v.play();
  const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
  const laco = () => {
    if (!fluxo || rota.tela !== 'ler') return para();
    if (v.readyState >= 2 && window.jsQR) {
      c.width = v.videoWidth; c.height = v.videoHeight; ctx.drawImage(v, 0, 0);

      if (r && r.data) { para(); const m = r.data.match(/#ordem=(.+)$/); importarOrdem(m ? m[1] : r.data); return; }

function amb(k, r, cp) { return `<label class="cp"><span>${r}</span><input class="med" inputmode="decimal" data-campo-num="${k}" value="${fmt(cp[k])}"></label>`; }
function fmtN(v) { return v == null ? '' : (+v).toFixed(8).replace(/0+$/, '').replace(/\.$/, '').replace('.', ','); }
function padroesHTML(cp) {

    return `<div class="padsel"><div class="top"><b>${esc(x.codigo)}</b><span>${esc(x.descricao)}</span><button class="mini" data-tirar="${esc(x.codigo)}">Tirar</button></div>
      <small>Cert. ${esc(x.certificado)} · ${esc(x.organismo)}</small><br><small class="${s.cls}">${s.txt}</small>${tab}</div>`;
  };
  return (usados.map(cartao).join('') || '<div class="msg erro" style="margin:0 0 10px">Nenhum padrão marcado.</div>') +
    (outros.length ? `<select data-addpad><option value="">+ Adicionar padrão…</option>${outros.map(x => `<option value="${esc(x.codigo)}">${esc(x.codigo)} · ${esc(x.descricao)}</option>`).join('')}</select>` : '');
}
// procura o peso nos padrões marcados: pelo nominal exato ou pelo VC (±0,1 %), só na mesma unidade da balança
function pesoDoPadrao(cp, cd, valor) {
  if (valor == null) return null;
  const un = cd.unidade || 'g';
  const jogos = db.perfil.padroes.filter(x => cp.padroes_usados.includes(x.codigo) && x.pesos && (!x.unidade_pesos || x.unidade_pesos === un));
  for (const x of jogos) for (const [n, t] of Object.entries(x.pesos)) if (Math.abs(+n - valor) < 1e-9) return { codigo: x.codigo, nominal: +n, ...t };
  for (const x of jogos) for (const [n, t] of Object.entries(x.pesos)) if (Math.abs(t.vc - valor) <= 0.001 * Math.abs(t.vc)) return { codigo: x.codigo, nominal: +n, ...t };
  return null;
}
function temJogoDePesos(cp, cd) { const un = cd.unidade || 'g'; return db.perfil.padroes.some(x => cp.padroes_usados.includes(x.codigo) && x.pesos && (!x.unidade_pesos || x.unidade_pesos === un)); }
function linhaPeso(t, un) { return `${t.codigo} · peso ${fmtN(t.nominal)} ${un}: VC ${fmtN(t.vc)} · uest ${fmtN(t.uest)} · upad ${fmtN(t.upad)}`; }
function novoPonto() { return { nominal: null, vc: null, m1_antes: null, depois: [null, null, null, null, null] }; }
function pontoHTML(pt, i, cd, rt) {
  const inp = (attr, v, cls = '') => `<input class="med ${cls}" inputmode="decimal" ${attr} value="${fmt(v)}">`;
  const k = rt === 'VC' ? 'vc' : 'nominal';
  return `<div class="ponto" data-i="${i}"><div class="top"><b>Ponto ${i + 1}</b><button class="mini" data-igual-pt="${i}">= VM</button><button class="mini" data-del-pt="${i}">✕</button></div>
    <div class="grade3"><div><div class="rot">${rt || 'VN'}</div>${inp(`data-pt="${i}" data-k="${k}"`, pt[k])}</div><div><div class="rot">VM antes</div>${inp(`data-pt="${i}" data-k="m1_antes"`, pt.m1_antes)}</div><div><div class="rot">VM depois</div>${inp(`data-pt="${i}" data-dep="0"`, pt.depois[0])}</div></div>
    <div class="rot">Repetições depois do ajuste: M2 a M5</div><div class="leit" style="grid-template-columns:repeat(4,1fr)">${pt.depois.slice(1).map((x, j) => inp(`data-pt="${i}" data-dep="${j + 1}"`, x)).join('')}</div>
    <div class="msg" data-msg="${i}"></div></div>`;
}

// avaliação de um ponto, na hora
function avaliaPonto(pt, i, pts, cd, cp) {
  const div = divisaoNum(cd.divisao) || 0; const casas = casasDe(cd.divisao) ?? 4;
  const lidas = pt.depois.filter(x => x != null);
  const out = { destoa: [], msgs: [] };
  if (lidas.length >= 3) {
    const med = lidas.slice().sort((a, b) => a - b)[Math.floor(lidas.length / 2)];
    pt.depois.forEach((x, j) => { if (x != null && div && Math.abs(x - med) > 5 * div) out.destoa.push(j); });
    if (out.destoa.length) out.msgs.push(['erro', `Leitura ${out.destoa.map(j => 'M' + (j + 1)).join(', ')} destoa das outras. Confira a leitura.`]);
  }
  const un = esc(cd.unidade || 'g');
  const tab = cp ? pesoDoPadrao(cp, cd, pt.vc ?? pt.nominal) : null;
  if (tab) out.msgs.push(['info', linhaPeso(tab, un)]);
  else if (cp && (pt.vc ?? pt.nominal) != null) out.msgs.push(['aviso', temJogoDePesos(cp, cd) ? 'Peso não encontrado no certificado dos padrões marcados: o laboratório completa VC e incertezas.' : 'Nenhum jogo de pesos marcado na tela de início: VC e incertezas ficam para o laboratório.']);
  const ref = pt.vc ?? tab?.vc ?? pt.nominal;
  if (ref != null && lidas.length) {
    const m = lidas.reduce((s, x) => s + x, 0) / lidas.length, ei = m - ref;
    out.msgs.push([div && Math.abs(ei) > 10 * div ? 'aviso' : 'ok', `Média ${fmt(m, casas)} · erro ${ei >= 0 ? '+' : ''}${fmt(ei, casas)} ${un}${pt.vc == null && !tab ? ' (sobre o nominal)' : ''}`]);
  }
  const ant = i > 0 ? (pts[i - 1].vc ?? pts[i - 1].nominal) : null;
  if (ref != null && ant != null && ref <= ant) out.msgs.push(['aviso', 'Carga menor ou igual ao ponto anterior: deve ser crescente.']);
  if (lidas.length > 1 && lidas.length < 5) out.msgs.push(['aviso', `Repetições pela metade: ${lidas.length} de 5 leituras depois do ajuste.`]);
  return out;
}
function atualizaPontos(inst) {
  const pts = inst.campo.pontos;
  pts.forEach((pt, i) => {
    const a = avaliaPonto(pt, i, pts, inst.cadastro, inst.campo);
    document.querySelectorAll(`[data-pt="${i}"][data-dep]`).forEach(el => el.classList.toggle('destoa', a.destoa.includes(+el.dataset.dep)));
    const m = document.querySelector(`[data-msg="${i}"]`); if (m) m.innerHTML = a.msgs.map(([c, t]) => `<div class="msg ${c}">${t}</div>`).join('');
  });
}

function ligaInstrumento(v, inst, p) {
  const cd = inst.cadastro, cp = inst.campo, tela = $('#tela');
  tela.oninput = tela.onchange = e => {
    const t = e.target, d = t.dataset;
    if (d.cad) cd[d.cad] = t.value.trim();
    else if (d.campo) cp[d.campo] = t.value;
    else if (d.campoNum) cp[d.campoNum] = num(t.value);
    else if ('addpad' in d) { if (t.value && !cp.padroes_usados.includes(t.value)) cp.padroes_usados.push(t.value); salvar(); return telaInstrumento(); }
    else if (d.pad) { cp.padroes_usados = [...document.querySelectorAll('[data-pad]:checked')].map(i => i.dataset.pad); }
    else if (d.pt != null && d.k) cp.pontos[+d.pt][d.k] = num(t.value);
    else if (d.pt != null && d.dep != null) cp.pontos[+d.pt].depois[+d.dep] = num(t.value);
    else if (d.exc) cp.excentricidade[d.exc][+d.i] = num(t.value);
    else if ('excvc' in d) { const k = (cp.ref_tipo || 'VN') === 'VC' ? 'vc' : 'nominal'; cp.excentricidade[k] = num(t.value); cp.excentricidade[k === 'vc' ? 'nominal' : 'vc'] = null; }
    salvar();
    if (p === 2) atualizaPontos(inst);
    if (p === 3) atualizaExc(inst);
    if (p === 4) { atualizaAmb(cp); $('#conf').innerHTML = conferencia(inst); }
  };
  tela.onclick = e => {
    const d = e.target.dataset;
    if (d.reftipo && d.reftipo !== (cp.ref_tipo || 'VN')) { const para = d.reftipo === 'VC' ? 'vc' : 'nominal', de = para === 'vc' ? 'nominal' : 'vc'; cp.pontos.forEach(pt => { if (pt[para] == null) pt[para] = pt[de]; pt[de] = null; }); cp.ref_tipo = d.reftipo; salvar(); return telaInstrumento(); }
    if (d.tirar) { cp.padroes_usados = cp.padroes_usados.filter(c => c !== d.tirar); salvar(); return telaInstrumento(); }
    if (e.target.id === 'nao-cal') { const m = prompt('Motivo (vai para as observações):'); if (m) { inst.situacao = 'nao_calibrado'; cp.observacoes = m; salvar(); history.back(); } }
    if (e.target.id === 'add-pt') { const ult = cp.pontos[cp.pontos.length - 1]; cp.pontos.push(novoPonto()); salvar(); telaInstrumento(); const ins = document.querySelectorAll(`[data-pt="${cp.pontos.length - 1}"][data-k="nominal"]`)[0]; ins && ins.focus(); }
    if (d.igualPt != null) { const pt = cp.pontos[+d.igualPt]; const b = pt.depois[0] ?? pt.m1_antes; if (b == null) return toast('Digite M1 primeiro'); pt.depois = pt.depois.map(x => x ?? b); salvar(); telaInstrumento(); }
    if (d.delPt != null) { if (confirm(`Apagar o ponto ${+d.delPt + 1}?`)) { cp.pontos.splice(+d.delPt, 1); salvar(); telaInstrumento(); } }
    if (d.igual) { const a = cp.excentricidade[d.igual]; if (a[0] == null) return toast('Digite a posição 1 primeiro'); for (let i = 0; i < 5; i++) a[i] = a[i] ?? a[0]; salvar(); telaInstrumento(); }
  };
  if (p === 2) atualizaPontos(inst);
  if (p === 3) atualizaExc(inst);
  if (p === 4) atualizaAmb(cp);
}
function atualizaExc(inst) {
  const e = inst.campo.excentricidade, cd = inst.cadastro, casas = casasDe(cd.divisao) ?? 4, m = $('#exc-msg'); if (!m) return;
  const ep = $('#exc-peso'), carga = e.vc ?? e.nominal, t = pesoDoPadrao(inst.campo, cd, carga);
  if (ep) { ep.className = 'msg ' + (t ? 'info' : carga != null ? 'aviso' : ''); ep.textContent = t ? linhaPeso(t, cd.unidade || 'g') : carga != null ? 'Peso não encontrado nos padrões marcados.' : ''; }
  const d = e.depois.filter(x => x != null);
  if (d.length < 5) { m.className = 'msg aviso'; m.textContent = `${5 - d.length} posição(ões) faltando.`; return; }
  const dif = Math.max(...d) - Math.min(...d);
  m.className = 'msg ok'; m.textContent = `Maior diferença entre posições: ${fmt(dif, casas)} ${cd.unidade || 'g'}`;
}
function atualizaAmb(cp) {
  const m = $('#amb-msg'); if (!m) return;
  const dt = cp.t_fim != null && cp.t_inicio != null ? Math.abs(cp.t_fim - cp.t_inicio) : null;
  m.className = 'msg ' + (dt != null && dt > 2 ? 'aviso' : 'ok');
  m.textContent = dt == null ? '' : `Variação de temperatura durante a calibração: ${fmt(dt, 1)} °C${dt > 2 ? '. Registre nas observações.' : ''}`;
}
function conferencia(inst) {
  const cp = inst.campo, cd = inst.cadastro, lin = [];
  const add = (c, t) => lin.push(`<div class="msg ${c}">${c === 'ok' ? '✔' : c === 'aviso' ? '△' : '✖'} ${t}</div>`);
  ['t_inicio', 'u_inicio', 'p_inicio', 't_fim', 'u_fim', 'p_fim'].some(k => cp[k] == null) ? add('erro', 'Condições ambientais incompletas.') : add('ok', 'Ambiente de início e fim registrado.');
  const pads = db.perfil.padroes.filter(x => cp.padroes_usados.includes(x.codigo));
  if (!pads.length) add('erro', 'Nenhum padrão marcado.');
  pads.forEach(x => { const s = situacaoPadrao(x, cp.data_calibracao); if (s.nivel) add(s.nivel === 2 ? 'erro' : 'aviso', `${x.codigo}: ${s.txt}`); });
  if (pads.length && pads.every(x => !situacaoPadrao(x, cp.data_calibracao).nivel)) add('ok', `${pads.length} padrão(ões) válidos na data.`);
  const pts = cp.pontos.filter(pt => pt.depois.some(x => x != null));
  if (!pts.length) add('erro', 'Nenhum ponto de carga medido.');
  else {
    let problemas = 0; pts.forEach((pt, i) => { const a = avaliaPonto(pt, i, pts, cd, cp); const n = pt.depois.filter(x => x != null).length; if (a.destoa.length || (n > 1 && n < 5)) problemas++; });
    problemas ? add('aviso', `${problemas} ponto(s) com leitura destoante ou repetições pela metade.`) : add('ok', `${pts.length} ponto(s) medidos.`);
    const soVM = pts.filter(pt => pt.depois.filter(x => x != null).length === 1).length; if (soVM) add('aviso', `${soVM} ponto(s) só com VM, sem as repetições M2 a M5.`);
    const semVC = pts.filter(pt => pt.vc == null).length; if (semVC) add('aviso', `${semVC} ponto(s) sem VC: o laboratório completa.`);
  }
  cp.excentricidade.depois.filter(x => x != null).length === 5 ? add('ok', 'Excentricidade nas 5 posições.') : add('aviso', 'Excentricidade incompleta.');
  if (!cd.n_metrologico) add('aviso', 'Sem nº metrológico.');
  return lin.join('');
}

// ---------- envio ----------
async function enviar(v) {
  const faltam = v.instrumentos.filter(i => !['pronto', 'nao_calibrado'].includes(i.situacao));
  if (faltam.length && !confirm(`${faltam.length} instrumento(s) ainda não concluído(s). Enviar assim mesmo?`)) return;
  if (!db.perfil.nome) { toast('Cadastre seu nome no perfil'); return ir({ tela: 'perfil' }); }
  const pacote = {
    versao: 1, visita_id: v.id, os: v.os, enviado: agoraISO(), cliente: v.cliente,
    tecnico: { nome: db.perfil.nome, apelido: db.perfil.apelido, padroes: db.perfil.padroes },
    instrumentos: v.instrumentos.map(i => { const campo = JSON.parse(JSON.stringify(i.campo)); campo.pontos.forEach(pt => { const t = pesoDoPadrao(i.campo, i.cadastro, pt.vc ?? pt.nominal); if (t) pt.padrao_peso = t; }); const te = pesoDoPadrao(i.campo, i.cadastro, campo.excentricidade.vc ?? campo.excentricidade.nominal); if (te) campo.excentricidade.padrao_peso = te; return { tipo: i.tipo, situacao: i.situacao, cadastro: Object.assign({ os: v.os }, i.cadastro), campo }; })
  };
  const nome = `visita ${(v.cliente.nome || 'cliente').replace(/[\\/:*?"<>|]/g, '-').slice(0, 40)} ${dataBR(v.criada).replace(/\//g, '-')}.json`;
  const arq = new File([JSON.stringify(pacote, null, 1)], nome, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [arq] })) await navigator.share({ files: [arq], title: nome });
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(arq); a.download = nome; a.click(); }
    v.enviada = agoraISO(); salvar(); telaVisita(); toast('Arquivo pronto');
  } catch (e) { if (e.name !== 'AbortError') toast('Não consegui compartilhar: ' + e.message); }
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
history.replaceState(rota, '');
desenha();
</script>
